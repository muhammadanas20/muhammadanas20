name: Update Profile Statistics

on:
  schedule:
    # Every day at 00:00 UTC
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout profile repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Generate LeetCode cards from public profile data
      # Local SVGs keep the README fast and available even if LeetCode is down.
      # --------------------------------------------------
      - name: Generate LeetCode profile cards
        run: python3 scripts/update_leetcode.py

      # --------------------------------------------------
      # Generate GitHub statistics card
      # --------------------------------------------------
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&theme=radical&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # Generate Top Languages card
      # --------------------------------------------------
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=true&theme=radical
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # Generate Contribution Streak
      # --------------------------------------------------
      - name: Generate Streak Stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=radical&hide_border=true&disable_animations=true&timezone=Asia/Karachi
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # Generate Activity Graph
      # --------------------------------------------------
      - name: Generate Activity Graph
        run: |
          curl -s -f --retry 5 --retry-delay 3 "https://github-readme-activity-graph.vercel.app/graph?username=${{ github.repository_owner }}&bg_color=0D1117&color=C9D1D9&line=22D3EE&point=FBBF24&area=true&area_color=8B5CF6&hide_border=true&height=165" -o profile/activity-graph.svg || true

      # --------------------------------------------------
      # Generate Contribution Snake
      # --------------------------------------------------
      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/github-snake.svg?palette=github-light
            profile/github-snake-dark.svg?palette=github-dark

      # --------------------------------------------------
      # Commit generated files
      # --------------------------------------------------
      - name: Commit generated profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/ README.md

          git diff --cached --quiet || git commit -m "chore: update profile statistics"

          git push
