name: Broken lesson or code
description: Something is wrong or outdated
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: where
    attributes:
      label: Where
      placeholder: phases/08-rag/Examples.md
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
  - type: input
    id: date
    attributes:
      label: Date you noticed (tools move fast)
      placeholder: "2026-08-21"
