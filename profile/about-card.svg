<svg width="480" height="370" viewBox="0 0 480 370" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Learn, build, repeat</title>
  <desc id="desc">A stylized dark coding workspace with a glowing terminal and three steps: learn, build, repeat.</desc>
  <defs>
    <linearGradient id="bg" x1="29" y1="8" x2="445" y2="355" gradientUnits="userSpaceOnUse">
      <stop stop-color="#161436" />
      <stop offset="0.52" stop-color="#0D1A2A" />
      <stop offset="1" stop-color="#101426" />
    </linearGradient>
    <linearGradient id="screen" x1="113" y1="70" x2="364" y2="247" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20264A" />
      <stop offset="1" stop-color="#0A1020" />
    </linearGradient>
    <linearGradient id="purple" x1="154" y1="78" x2="271" y2="198" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C4B5FD" />
      <stop offset="1" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="blue" x1="304" y1="76" x2="390" y2="174" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9" />
      <stop offset="1" stop-color="#0891B2" />
    </linearGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientTransform="translate(240 165) rotate(90) scale(175)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.28" />
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#C4B5FD" fill-opacity="0.12" />
    </pattern>
    <filter id="shadow" x="58" y="38" width="379" height="246" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#020617" flood-opacity="0.6" />
    </filter>
    <filter id="glow" x="68" y="52" width="335" height="193" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" />
    </filter>
  </defs>

  <rect x="2" y="2" width="476" height="366" rx="29" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2" />
  <rect x="2" y="2" width="476" height="366" rx="29" fill="url(#dots)" />
  <circle cx="240" cy="166" r="167" fill="url(#orb)" />
  <path d="M54 93C91 61 122 52 157 57" stroke="#22D3EE" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="4 6" />
  <path d="M326 57C364 61 396 81 427 116" stroke="#A78BFA" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="4 6" />

  <g transform="translate(47 33)">
    <circle cx="8" cy="8" r="4" fill="#22D3EE" />
    <text x="22" y="12" fill="#C4B5FD" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.3">CURIOSITY.EXE</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="78" y="72" width="324" height="194" rx="22" fill="url(#screen)" stroke="#FFFFFF" stroke-opacity="0.16" />
    <path d="M78 113H402" stroke="#FFFFFF" stroke-opacity="0.1" />
    <circle cx="106" cy="92" r="4.5" fill="#FB7185" />
    <circle cx="122" cy="92" r="4.5" fill="#FBBF24" />
    <circle cx="138" cy="92" r="4.5" fill="#4ADE80" />
    <rect x="157" y="87" width="101" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.09" />

    <rect x="101" y="135" width="174" height="88" rx="14" fill="#0B1020" stroke="#A78BFA" stroke-opacity="0.25" />
    <rect x="111" y="147" width="34" height="8" rx="4" fill="url(#purple)" />
    <rect x="151" y="147" width="79" height="8" rx="4" fill="#E2E8F0" fill-opacity="0.8" />
    <rect x="111" y="165" width="118" height="6" rx="3" fill="#22D3EE" fill-opacity="0.7" />
    <rect x="111" y="181" width="88" height="6" rx="3" fill="#64748B" fill-opacity="0.7" />
    <rect x="111" y="197" width="130" height="6" rx="3" fill="#64748B" fill-opacity="0.45" />

    <circle cx="319" cy="172" r="46" fill="#8B5CF6" fill-opacity="0.11" filter="url(#glow)" />
    <circle cx="319" cy="172" r="39" fill="#0D1A2A" stroke="#22D3EE" stroke-opacity="0.45" />
    <circle cx="319" cy="172" r="28" stroke="#A78BFA" stroke-opacity="0.55" stroke-dasharray="4 5" />
    <path d="M312 167L320 159L328 167" stroke="#67E8F9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M320 159V184" stroke="#67E8F9" stroke-width="2.5" stroke-linecap="round" />
    <path d="M311 184H329" stroke="#67E8F9" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="355" cy="133" r="5" fill="#FBBF24" />
    <circle cx="362" cy="211" r="4" fill="#A78BFA" />
    <circle cx="281" cy="219" r="3.5" fill="#22D3EE" />
  </g>

  <path d="M172 266L151 291H328L307 266H172Z" fill="#0B1020" stroke="#FFFFFF" stroke-opacity="0.13" />
  <rect x="211" y="277" width="58" height="5" rx="2.5" fill="#A78BFA" fill-opacity="0.55" />

  <g transform="translate(45 303)">
    <rect width="116" height="42" rx="14" fill="#171637" stroke="#C4B5FD" stroke-opacity="0.28" />
    <circle cx="20" cy="21" r="10" fill="#8B5CF6" fill-opacity="0.24" />
    <path d="M16 21H24M20 17V25" stroke="#DDD6FE" stroke-width="1.8" stroke-linecap="round" />
    <text x="38" y="18" fill="#EDE9FE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="800">LEARN</text>
    <text x="38" y="31" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9">go deeper</text>
  </g>
  <g transform="translate(182 303)">
    <rect width="116" height="42" rx="14" fill="#0E2533" stroke="#67E8F9" stroke-opacity="0.28" />
    <circle cx="20" cy="21" r="10" fill="#22D3EE" fill-opacity="0.2" />
    <path d="M16 24L20 17L24 24" stroke="#CFFAFE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="38" y="18" fill="#CFFAFE" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="800">BUILD</text>
    <text x="38" y="31" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9">make it real</text>
  </g>
  <g transform="translate(319 303)">
    <rect width="116" height="42" rx="14" fill="#2B1A2F" stroke="#F9A8D4" stroke-opacity="0.28" />
    <circle cx="20" cy="21" r="10" fill="#F472B6" fill-opacity="0.18" />
    <path d="M15.5 21H24.5M21.5 17L25.5 21L21.5 25" stroke="#FCE7F3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="38" y="18" fill="#FCE7F3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="800">REPEAT</text>
    <text x="38" y="31" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9">make it better</text>
